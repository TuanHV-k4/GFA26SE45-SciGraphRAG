services:
  postgres:
    image: postgres:17-alpine
    container_name: scigraphrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scigraphrag}
      POSTGRES_USER: ${POSTGRES_USER:-scigraphrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scigraphrag_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  core_postgres_data:
